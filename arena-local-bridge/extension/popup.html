<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Local Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon48.png" alt="Logo" class="logo" />
      <div>
        <h1>Arena Local Bridge</h1>
        <p class="subtitle">Localhost HTTP + Token (Secenek 2B)</p>
      </div>
    </header>

    <section class="card">
      <div class="row-between">
        <span class="label">Sunucu Durumu</span>
        <span id="statusBadge" class="pill pill-wait">Kontrol ediliyor</span>
      </div>
      <div id="hostInfo" class="mono-box">Baglanti bekleniyor...</div>
      <button id="pingBtn" type="button" class="btn">Baglantiyi Test Et (Ping)</button>
    </section>

    <section class="card">
      <div class="label" style="margin-bottom: 6px;">Yerel Sunucu Baglantisi</div>
      <label class="field-label" for="serverUrlInput">Sunucu Adresi (127.0.0.1)</label>
      <input id="serverUrlInput" type="text" class="input" placeholder="http://127.0.0.1:38450" />

      <div class="row-between" style="margin-top: 8px; margin-bottom: 4px;">
        <label class="field-label" style="margin: 0;" for="apiTokenInput">API Token</label>
        <button id="toggleTokenBtn" type="button" class="btn btn-xs">Goster</button>
      </div>
      <input id="apiTokenInput" type="password" class="input" placeholder="Terminalde yazan Token'i yapistirin" />

      <button id="saveConnBtn" type="button" class="btn btn-primary" style="margin-top: 8px;">Kaydet ve Baglan</button>
      <div class="hint" style="margin-top: 8px;">
        Bilgisayarinizda <code>./start.sh</code> veya <code>start.bat</code> calistirip terminalde gorunen Token'i yapistirmaniz yeterlidir.
      </div>
    </section>

    <section class="card">
      <div class="label" style="margin-bottom: 8px;">Otomasyon ve Ayarlar</div>
      <label class="toggle">
        <input type="checkbox" id="enabledChk" />
        <span>Arena.ai sayfasinda arac bloklarini algila</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoRunChk" />
        <span>Araclari otomatik calistir (onay beklemeden)</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoInsertChk" />
        <span>Sonucu otomatik olarak sohbet kutusuna yaz</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="autoSubmitChk" />
        <span>Yazilan sonucu otomatik olarak chate gonder</span>
      </label>
      <div class="row-between" style="margin-top: 8px; margin-bottom: 0;">
        <label class="field-label" style="margin: 0;" for="maxAutoStepsInput">Maks. ardisik otomatik adim</label>
        <input id="maxAutoStepsInput" type="number" min="1" max="100" class="input" style="width: 72px; text-align: center;" />
      </div>
    </section>

    <section class="card">
      <button id="copyPromptBtn" type="button" class="btn">Sistem Promptunu Kopyala</button>
      <div id="msgBox" class="msg"></div>
    </section>
  </div>

  <script src="tool-parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
